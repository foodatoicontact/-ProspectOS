# PRODUCTION migration tool for ProspectOS (vptqxhlxwiljfbkybqej). Manual only (workflow_dispatch). Applies an EXPLICIT
# list of migrations, and only those staging already ran from the very same file:
#   1. verify-staging (Environment "prospectos-staging", secret SUPABASE_STAGING_DB_URL): each listed migration is
#      recorded on staging by the staging runner with this commit's exact file text. Nothing is written.
#   2. production (Environment "prospectos-production", required reviewers = the approval step, secret
#      SUPABASE_PRODUCTION_DB_URL): mode "dry-run" runs everything then rolls back; mode "apply" commits.
# The migrations come from `ref`, pinned to `expected_sha` (the commit reviewed); the runner
# (scripts/production-migrate.sh, all database guards) comes from this workflow's own commit, so a branch cannot bring
# its own runner. Production starts only after staging was verified.
name: Production migrations
on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Branch holding the migrations (e.g. main)'
        required: true
        type: string
      expected_sha:
        description: 'Full 40-character commit SHA of that branch, as reviewed'
        required: true
        type: string
      migrations:
        description: 'Exact migrations to apply, in order, comma-separated (e.g. 035_self_outreach,037_outreach_booking_meetings)'
        required: true
        type: string
      mode:
        description: 'dry-run (apply then roll back) or apply'
        required: true
        type: choice
        options: [dry-run, apply]
      confirm_project_ref:
        description: 'Type the PRODUCTION project ref to confirm (vptqxhlxwiljfbkybqej)'
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: production-migrations
  cancel-in-progress: false
jobs:
  verify-staging:
    if: github.repository == 'foodatoicontact/-ProspectOS'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: prospectos-staging
    steps:
      - name: Validate inputs (before anything is fetched)
        env:
          INPUT_REF: ${{ inputs.ref }}
          INPUT_SHA: ${{ inputs.expected_sha }}
          INPUT_MIGRATIONS: ${{ inputs.migrations }}
        run: |
          [[ "$INPUT_REF" =~ ^[A-Za-z0-9][A-Za-z0-9._/-]{0,199}$ && "$INPUT_REF" != *..* && "$INPUT_REF" != *//* ]] || { echo "invalid ref"; exit 1; }
          [[ "$INPUT_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "expected_sha must be a full 40-character lowercase commit SHA"; exit 1; }
          [[ "$INPUT_MIGRATIONS" =~ ^[0-9]{3}_[a-z0-9_]+(,[0-9]{3}_[a-z0-9_]+){0,9}$ ]] || { echo "invalid migrations list"; exit 1; }
      - name: Checkout the runner (this workflow's own commit)
        uses: actions/checkout@v4
        with:
          path: tool
          persist-credentials: false
      - name: Checkout the migrations of the selected ref (read only, no persisted credentials)
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          path: target
          fetch-depth: 1
          persist-credentials: false
      - name: PostgreSQL client
        run: psql --version || (sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client)
      - name: Verify the migrations ran on staging from the same files (read only)
        env:
          SUPABASE_STAGING_DB_URL: ${{ secrets.SUPABASE_STAGING_DB_URL }}
          CONFIRM_PROJECT_REF: ggilyurgopsjrpnvxovl
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          MIGRATIONS: ${{ inputs.migrations }}
          PRODUCTION_MIGRATE_MODE: verify-staging
          PRODUCTION_MIGRATE_TARGET: target
        run: |
          echo "::add-mask::$SUPABASE_STAGING_DB_URL"
          bash tool/scripts/production-migrate.sh
  production:
    needs: verify-staging
    if: github.repository == 'foodatoicontact/-ProspectOS'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: prospectos-production
    steps:
      - name: Validate inputs (before anything is fetched)
        env:
          INPUT_REF: ${{ inputs.ref }}
          INPUT_SHA: ${{ inputs.expected_sha }}
          INPUT_MIGRATIONS: ${{ inputs.migrations }}
          INPUT_MODE: ${{ inputs.mode }}
        run: |
          [[ "$INPUT_REF" =~ ^[A-Za-z0-9][A-Za-z0-9._/-]{0,199}$ && "$INPUT_REF" != *..* && "$INPUT_REF" != *//* ]] || { echo "invalid ref"; exit 1; }
          [[ "$INPUT_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "expected_sha must be a full 40-character lowercase commit SHA"; exit 1; }
          [[ "$INPUT_MIGRATIONS" =~ ^[0-9]{3}_[a-z0-9_]+(,[0-9]{3}_[a-z0-9_]+){0,9}$ ]] || { echo "invalid migrations list"; exit 1; }
          [[ "$INPUT_MODE" == "dry-run" || "$INPUT_MODE" == "apply" ]] || { echo "invalid mode"; exit 1; }
      - name: Checkout the runner (this workflow's own commit)
        uses: actions/checkout@v4
        with:
          path: tool
          persist-credentials: false
      - name: Checkout the migrations of the selected ref (read only, no persisted credentials)
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          path: target
          fetch-depth: 1
          persist-credentials: false
      - name: PostgreSQL client
        run: psql --version || (sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client)
      - name: Apply the listed migrations to production (guarded)
        env:
          SUPABASE_PRODUCTION_DB_URL: ${{ secrets.SUPABASE_PRODUCTION_DB_URL }}
          CONFIRM_PROJECT_REF: ${{ inputs.confirm_project_ref }}
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          MIGRATIONS: ${{ inputs.migrations }}
          PRODUCTION_MIGRATE_MODE: ${{ inputs.mode }}
          PRODUCTION_MIGRATE_TARGET: target
        run: |
          echo "::add-mask::$SUPABASE_PRODUCTION_DB_URL"
          bash tool/scripts/production-migrate.sh
