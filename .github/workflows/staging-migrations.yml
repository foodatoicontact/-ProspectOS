# Applies the O1/O2 migrations 027 then 028 to the STAGING Supabase project (-ProspectOS-staging, ggilyurgopsjrpnvxovl)
# and nothing else. Manual only (workflow_dispatch): no push, pull request or schedule trigger. The job runs in the
# GitHub Environment "prospectos-staging" (add required reviewers there to get an approval step), the only place the
# SUPABASE_STAGING_DB_URL secret lives. All the guards (staging ref, never the production ref, reviewed file MD5s,
# stop on the first error, verification before recording) are in scripts/staging-migrate.sh; this file only wires it.
name: Staging migrations (O1/O2 027-028)
on:
  workflow_dispatch:
    inputs:
      confirm_project_ref:
        description: 'Type the STAGING project ref to confirm (ggilyurgopsjrpnvxovl)'
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: staging-migrations
  cancel-in-progress: false
jobs:
  migrate-staging:
    if: github.repository == 'foodatoicontact/-ProspectOS'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: prospectos-staging
    steps:
      - name: Checkout (read only, no persisted credentials)
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: PostgreSQL client
        run: psql --version || (sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client)
      - name: Apply 027 then 028 to staging (guarded)
        env:
          SUPABASE_STAGING_DB_URL: ${{ secrets.SUPABASE_STAGING_DB_URL }}
          CONFIRM_PROJECT_REF: ${{ inputs.confirm_project_ref }}
        run: |
          echo "::add-mask::$SUPABASE_STAGING_DB_URL"
          bash scripts/staging-migrate.sh
