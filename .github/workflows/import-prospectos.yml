# Import autonome des 64 fichiers de ProspectOS-Discovery-SEO(2).zip.
# Aucun ZIP n'est ajoute au depot. Les donnees ci-dessous sont le code source encode.
# Ce workflow doit etre place dans .github/workflows/import-prospectos.yml.
name: Import ProspectOS
on:
  push:
    branches: [main]
    paths: ['.github/workflows/import-prospectos.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: prospectos-source-import
  cancel-in-progress: false
jobs:
  import:
    if: github.repository == 'foodatoicontact/-ProspectOS' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Recuperer main
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Restaurer, verifier et pousser les 64 fichiers
        shell: python
        env:
          PROSPECTOS_PAYLOAD_000: ""
          PROSPECTOS_PAYLOAD_001: ""
          PROSPECTOS_PAYLOAD_002: ""
          PROSPECTOS_PAYLOAD_003: ""
          PROSPECTOS_PAYLOAD_004: ""
          PROSPECTOS_PAYLOAD_005: ""
          PROSPECTOS_PAYLOAD_006: ""
          PROSPECTOS_PAYLOAD_007: ""
          PROSPECTOS_PAYLOAD_008: ""
          PROSPECTOS_PAYLOAD_009: ""
          PROSPECTOS_PAYLOAD_010: ""
          PROSPECTOS_PAYLOAD_011: ""
          PROSPECTOS_PAYLOAD_012: ""
          PROSPECTOS_PAYLOAD_013: ""
          PROSPECTOS_PAYLOAD_014: ""
          PROSPECTOS_PAYLOAD_015: ""
          PROSPECTOS_PAYLOAD_016: ""
          PROSPECTOS_PAYLOAD_017: ""
          PROSPECTOS_PAYLOAD_018: ""
          PROSPECTOS_PAYLOAD_019: ""
          PROSPECTOS_PAYLOAD_020: ""
          PROSPECTOS_PAYLOAD_021: ""
          PROSPECTOS_PAYLOAD_022: ""
        run: |
          import base64, hashlib, json, os, subprocess, zlib
          from pathlib import Path, PurePosixPath

          def git(*args):
              return subprocess.check_output(['git', *args], text=True).strip()

          if os.environ.get('GITHUB_REPOSITORY') != 'foodatoicontact/-ProspectOS':
              raise SystemExit('Depot incorrect : import annule.')
          if os.environ.get('GITHUB_REF') != 'refs/heads/main':
              raise SystemExit('Cet import doit etre lance sur main.')
          encoded = ''.join(os.environ[k] for k in sorted(os.environ) if k.startswith('PROSPECTOS_PAYLOAD_'))
          raw = zlib.decompress(base64.b64decode(encoded, validate=True))
          if hashlib.sha256(raw).hexdigest() != 'c8d0addffaefd88fe1dd004af31ca958230e6af1a660acc5cba8619ebf3be966':
              raise SystemExit('Integrite du contenu invalide.')
          files = json.loads(raw)
          if len(files) != 64:
              raise SystemExit('Nombre de fichiers incorrect.')
          root = Path.cwd().resolve()
          prepared = []
          seen = set()
          for item in files:
              rel = PurePosixPath(item['path'])
              if rel.is_absolute() or '..' in rel.parts or not rel.parts or '.git' in rel.parts:
                  raise SystemExit('Chemin interdit.')
              if rel.parts[0] == '.github' or rel.suffix.lower() == '.zip' or str(rel) in seen:
                  raise SystemExit('Fichier interdit ou doublon.')
              seen.add(str(rel))
              target = root.joinpath(*rel.parts)
              if not target.resolve().is_relative_to(root):
                  raise SystemExit('Chemin hors depot.')
              for part in [target, *target.parents]:
                  if part == root:
                      break
                  if part.is_symlink():
                      raise SystemExit('Lien symbolique interdit.')
              data = base64.b64decode(item['data'], validate=True)
              if hashlib.sha256(data).hexdigest() != item['sha256']:
                  raise SystemExit('Integrite invalide : ' + str(rel))
              if target.exists() and (not target.is_file() or target.read_bytes() != data):
                  raise SystemExit('Fichier existant different, aucun remplacement : ' + str(rel))
              prepared.append((str(rel), target, data))
          for rel, target, data in prepared:
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_bytes(data)
          for rel, target, data in prepared:
              if target.read_bytes() != data:
                  raise SystemExit('Verification apres ecriture echouee : ' + rel)
          git('add', '--', *[rel for rel, _, _ in prepared])
          changed = subprocess.run(['git', 'diff', '--cached', '--quiet']).returncode
          if changed == 0:
              result = 'Les 64 fichiers sont deja presents et identiques. Aucun nouveau commit.'
          elif changed == 1:
              git('config', 'user.name', 'github-actions[bot]')
              git('config', 'user.email', '41898282+github-actions[bot]@users.noreply.github.com')
              git('commit', '-m', 'Import ProspectOS Discovery SEO sources at repository root')
              git('push', 'origin', 'HEAD:main')
              result = '64 fichiers verifies et importes a la racine de main. Commit : ' + git('rev-parse', 'HEAD')
          else:
              raise SystemExit('Impossible de verifier les changements Git.')
          print(result)
          summary = os.environ.get('GITHUB_STEP_SUMMARY')
          if summary:
              with open(summary, 'a') as f:
                  f.write(result + '\n')
